[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = [
    ".",
    "crates/db",
    "crates/asset-processor",
    "crates/agent"
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.11.2", features = ["protocol-asset"] }
rusqlite = { version = "0.40.0", features = ["bundled"] }
uuid = { version = "1.20.0", features = ["v4"] }
specta = { version = "2.0.0-rc.20", features = ["derive", "serde_json"] }
tauri-specta = { version = "2.0.0-rc.15", features = [
    "javascript",
    "typescript",
] }
specta-typescript = "0.0.12"
reqwest = { version = "0.13.3", features = ["json"] }
tokio = { version = "1.52.3", features = ["full"] }
sqlite-vec = "0.1.9"
hound = "3.5.1"
whisper-rs = "0.16.0"
image = { version = "0.25.6", default-features = false, features = [
    "png",
    "jpeg",
] }
base64 = "0.22"
ndarray = "0.17.2"
ort = "2.0.0-rc.9"
instant-clip-tokenizer = "0.1.0"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
rush-db = { path = "crates/db" }
rush-asset-processor = { path = "crates/asset-processor" }
rush-agent = { path = "crates/agent" }

serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
tauri = { workspace = true }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tokio = { workspace = true }
uuid = { workspace = true }
specta = { workspace = true }
tauri-specta = { workspace = true }
specta-typescript = { workspace = true }
rusqlite = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tauri = { version = "2.11.2", features = ["test"] }
